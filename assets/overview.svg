<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">Account Memory Design</title>
<desc id="desc">Evidence, claim and memory form a bounded data path. Consent, versions, stop and restore form its control plane. Public design edition 0.2.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#738aa6"/></marker></defs>
<rect width="1200" height="380" rx="18" fill="#101c30"/>
<g fill="none" stroke="#21324a"><path d="M40 105H1160M40 300H1160"/><path d="M900 28V352M980 28V352M1060 28V352M1140 28V352"/></g>
<text x="48" y="48" font-family="Arial,sans-serif" font-size="13" letter-spacing="3" fill="#80c8c0">ENGINEERING NOTES / PUBLIC DESIGN 0.2</text>
<text x="48" y="88" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#f3f6fa">Account Memory Design</text>
<g font-family="Arial,sans-serif">
<rect x="48" y="132" width="280" height="112" rx="10" fill="#192c45" stroke="#38516f"/>
<text x="70" y="160" font-size="12" letter-spacing="2" fill="#80c8c0">01 / SOURCE</text><text x="70" y="193" font-size="25" font-weight="700" fill="#f3f6fa">Evidence</text><text x="70" y="220" font-size="14" fill="#b3c3d8">What was actually provided?</text>
<rect x="458" y="132" width="280" height="112" rx="10" fill="#192c45" stroke="#38516f"/>
<text x="480" y="160" font-size="12" letter-spacing="2" fill="#80c8c0">02 / UNDERSTANDING</text><text x="480" y="193" font-size="25" font-weight="700" fill="#f3f6fa">Claim</text><text x="480" y="220" font-size="14" fill="#b3c3d8">What does it support, and where?</text>
<rect x="868" y="132" width="280" height="112" rx="10" fill="#192c45" stroke="#38516f"/>
<text x="890" y="160" font-size="12" letter-spacing="2" fill="#80c8c0">03 / TASK VIEW</text><text x="890" y="193" font-size="25" font-weight="700" fill="#f3f6fa">Memory</text><text x="890" y="220" font-size="14" fill="#b3c3d8">What may this task use now?</text>
<path d="M340 188H444M750 188H854" stroke="#738aa6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="48" y="282" font-size="15" fill="#80c8c0">CONTROL PLANE</text><text x="228" y="282" font-size="15" fill="#e1e9f2">Consent / Versions / Stop / Restore / Budget</text>
<text x="48" y="335" font-size="15" fill="#b3c3d8">Evidence-grounded. User-controlled. Bounded by task and current authority.</text>
<text x="48" y="359" font-size="12" fill="#8198b5">Design reference + synthetic examples. No production or user-benefit claims.</text>
</g></svg>
